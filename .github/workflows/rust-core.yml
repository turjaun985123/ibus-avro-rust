name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run Rust checks
        run: cargo test --locked --manifest-path rust/avro-phonetic/Cargo.toml --all-targets
      - name: Build Rust IBus engine binary
        run: cargo build --locked --release --manifest-path rust/avro-phonetic/Cargo.toml --bin avro-phonetic-ibus
      - name: Publish Rust IBus engine artifact
        uses: actions/upload-artifact@v7
        with:
          name: avro-phonetic-ibus-linux-x86_64
          path: rust/avro-phonetic/target/release/avro-phonetic-ibus
          if-no-files-found: error
          retention-days: 30
