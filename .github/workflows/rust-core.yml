name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run Rust checks
        run: cargo test --manifest-path rust/avro-phonetic/Cargo.toml --all-targets
      - name: Export CI-generated lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-cargo-lockfile
          path: rust/avro-phonetic/Cargo.lock
          if-no-files-found: error
          retention-days: 1
