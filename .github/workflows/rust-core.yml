name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run Rust checks
        run: cargo test --manifest-path rust/avro-phonetic/Cargo.toml --all-targets
