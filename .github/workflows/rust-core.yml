name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GIO development files
        run: sudo apt-get update && sudo apt-get install --yes libglib2.0-dev
      - name: Build and run Rust checks
        run: cargo test --manifest-path rust/avro-phonetic/Cargo.toml --all-targets
      - name: Build Rust IBus engine binary
        run: cargo build --release --manifest-path rust/avro-phonetic/Cargo.toml --bin avro-phonetic-ibus
      - name: Export CI-generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: rust-cargo-lockfile
          path: rust/avro-phonetic/Cargo.lock
          if-no-files-found: error
          retention-days: 1
      - name: Publish Rust IBus engine artifact
        uses: actions/upload-artifact@v7
        with:
          name: avro-phonetic-ibus-linux-x86_64
          path: rust/avro-phonetic/target/release/avro-phonetic-ibus
          if-no-files-found: error
          retention-days: 30
