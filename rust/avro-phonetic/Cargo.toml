[package]
name = "avro-phonetic"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Avro phonetic transliteration and suggestions for Bengali"

[lib]
name = "avro_phonetic"
path = "src/lib.rs"

[[bin]]
name = "avro-phonetic"
path = "src/main.rs"

[[bin]]
name = "avro-phonetic-ibus"
path = "src/ibus.rs"

[dependencies]
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
